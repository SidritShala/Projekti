<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Illyrian PlayHouse</title>
    <link rel="stylesheet" href="SignUp.css">
</head>
<body>

    <div class="wrapper">
        <!-- Form submits to a PHP script -->
        <form action="signup_process.php" method="post">
            <h1>Sign Up</h1>

            <!-- Username Input -->
            <div class="input-box">
                <input type="text" name="username" placeholder="Username" required>
                <i class="bx bxs-user"></i>
            </div>

            <!-- Email Input -->
            <div class="input-box">
                <input type="email" name="email" placeholder="Email" required>
                <i class="bx bxs-envelope"></i>
            </div>

            <!-- Password Input -->
            <div class="input-box">
                <input type="password" name="password" placeholder="Password" required>
                <i class="bx bxs-lock-alt"></i>
            </div>

            <!-- Confirm Password Input -->
            <div class="input-box">
                <input type="password" name="confirm_password" placeholder="Confirm Password" required>
                <i class="bx bxs-lock"></i>
            </div>

            <!-- Terms Agreement -->
            <div class="agree-terms">
                <label><input type="checkbox" name="terms" required> I agree to the <a href="#">Terms & Conditions</a></label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn">Sign Up</button>

            <!-- Login Link -->
            <div class="login-link">
                <p>Already have an account? <a href="OnlineGameStore-LoginForm.php">Login</a></p>
            </div>
        </form>
    </div>
    
</body>
</html>
